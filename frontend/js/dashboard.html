<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — PlaceX</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/dashboard.css"></head>
<body data-page="dashboard" data-auth="required">
<div class="app"><aside id="sidebar"></aside>
<main class="content">
  <div class="page-head hello"><h1 id="hello">Hi 👋</h1><p>Let's continue your placement journey.</p></div>
  <div id="notice"></div>
  <section class="grid g4" aria-label="Statistics">
    <div class="glass stat"><span>Resumes</span><b id="sResumes">–</b></div>
    <div class="glass stat"><span>Analyses</span><b id="sReports">–</b></div>
    <div class="glass stat"><span>Prep plan items</span><b id="sItems">–</b><small id="sItemsSub"></small></div>
    <div class="glass stat"><span>Companies</span><b id="sCompanies">–</b></div>
  </section>

  <div class="section-title"><h2>Quick actions</h2></div>
  <section class="quick">
    <a class="glass hover" href="analyze.html"><span class="ico">⬆️</span>Upload Resume</a>
    <a class="glass hover" id="qAnalyze" href="analyze.html"><span class="ico">📊</span>Analyze Resume</a>
    <a class="glass hover" href="build-resume.html"><span class="ico">✍️</span>Build Resume</a>
    <a class="glass hover" href="prep-plan.html"><span class="ico">🗺️</span>Generate Prep Plan</a>
    <a class="glass hover" href="companies.html"><span class="ico">🏢</span>Explore Companies</a>
  </section>

  <div class="cols" style="margin-top:2rem">
    <section class="glass"><div class="section-title" style="margin-top:0"><h2>Recent activity</h2></div><div id="activity"><p class="muted">Loading…</p></div></section>
    <div class="grid">
      <section class="glass" style="text-align:center"><h2 style="text-align:left">ATS score</h2>
        <div class="ring" id="ring"><svg viewBox="0 0 120 120" width="170" height="170"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><circle class="tr" cx="60" cy="60" r="52"/><circle class="fg" id="ringFg" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>
        <div class="val"><b id="atsVal">–</b><span id="atsLbl">No analysis yet</span></div></div>
        <small class="muted" id="atsSub"></small></section>
      <section class="glass"><h2>Current preparation</h2><div id="prep" style="margin-top:.8rem"></div></section>
    </div>
  </div>
  <section class="glass" style="margin-top:1rem"><h2>Upcoming journey</h2><div id="journey" style="margin-top:.6rem"></div></section>
</main></div>
<script src="js/config.js"></script><script src="js/api.js?v=3"></script><script src="js/core.js"></script><script src="js/dashboard.js"></script>
</body></html>
